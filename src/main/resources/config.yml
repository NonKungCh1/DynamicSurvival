# ===============================================================
# DynamicSurvival v1.0 Configuration
# ===============================================================

# --- การตั้งค่าฤดูกาล ---
season-duration:
  spring: 20  # จำนวนวันในฤดูใบไม้ผลิ (หน่วย: วันในเกม)
  summer: 20  # จำนวนวันในฤดูร้อน
  autumn: 20  # จำนวนวันในฤดูใบไม้ร่วง
  winter: 20  # จำนวนวันในฤดูหนาว

# --- การตั้งค่าอุณหภูมิ ---
temperature:
  base-temp:
    spring: 25.0  # อุณหภูมิพื้นฐานของฤดูใบไม้ผลิ
    summer: 35.0  # อุณหภูมิพื้นฐานของฤดูร้อน
    autumn: 20.0  # อุณหภูมิพื้นฐานของฤดูใบไม้ร่วง
    winter: -5.0   # อุณหภูมิพื้นฐานของฤดูหนาว
  thresholds:
    normal: 25.0      # จุดเริ่มต้นของโซนอุณหภูมิ 'ปกติ'
    hot: 35.0         # จุดเริ่มต้นของโซน 'ร้อน' (ติดสถานะ Weakness)
    deadly-hot: 40.0  # จุดเริ่มต้นของโซน 'ร้อนจัด' (เริ่มเสียเลือด)
    freezing: 5.0     # จุดเริ่มต้นของโซน 'หนาว' (ติดสถานะ Slowness)
    cold: 0.0         # จุดเริ่มต้นของโซน 'หนาวจัด' (เริ่มเสียเลือด)

# --- การตั้งค่าความกระหายน้ำ ---
thirst:
  max-level: 100                 # ค่าความกระหายน้ำสูงสุด
  base-loss-per-update: 0.4      # ค่าความกระหายน้ำที่ลดลงพื้นฐาน (ต่อ 2 วินาที)
  water-bottle-restore: 30       # จำนวนความกระหายน้ำที่ฟื้นฟูจากการดื่มขวดน้ำ
  danger-level: 10               # ระดับความกระหายน้ำที่เริ่มแสดงผลข้างเคียงรุนแรง

# --- เอฟเฟกต์พิเศษและชุดเกราะ ---
special-effects:
  leaf-armor-set-bonus:
    required-pieces: 3          # จำนวนชิ้นที่ต้องใส่เพื่อรับโบนัส
    nether-heat-reduction: 60.0 # ค่าการลดความร้อนจาก Nether (เมื่อใส่ครบเซ็ต)
    temperature-reduction: 5.0  # ค่าการลดอุณหภูมิในโลกปกติ (เมื่อใส่ครบเซ็ต)
  leather-armor-set-bonus:
    required-pieces: 3          # จำนวนชิ้นที่ต้องใส่เพื่อรับโบนัส
    warmth-bonus: 15.0          # โบนัสค่าความอบอุ่น (เมื่อใส่ครบเซ็ต)
  nether:
    temperature-increase: 60.0  # อุณหภูมิที่เพิ่มขึ้นเมื่ออยู่ใน Nether
    thirst-loss-multiplier: 2.5 # ตัวคูณการเสียความกระหายน้ำใน Nether
  environment:
    fire-temp-increase: 10.0          # อุณหภูมิที่เพิ่มขึ้นเมื่ออยู่ใกล้ไฟ
    water-snow-temp-decrease: -10.0   # อุณหภูมิที่ลดลงเมื่ออยู่ในน้ำ/บนหิมะ
    powder-snow-temp-decrease: -20.0  # อุณหภูมิที่ลดลงเมื่ออยู่ใน Powder Snow

# --- เอฟเฟกต์ตาม Biome ---
biome-effects:
  desert:
    thirst-loss-multiplier: 2.0 # ตัวคูณการเสียความกระหายน้ำในทะเลทราย
  cold-biome:
    temperature-decrease: -7.0  # อุณหภูมิที่ลดลงใน Biome ที่หนาวเย็น (เช่น Taiga, Snowy Plains)

# --- การตั้งค่าถุงน้ำ ---
water-pouch:
  thirst-restore-amount: 30       # จำนวนความกระหายน้ำที่ฟื้นฟูเมื่อดื่มจากถุงน้ำ
  drink-cooldown-seconds: 1.5   # คูลดาวน์หลังจากการดื่ม (หน่วย: วินาที)
  tiers:
    1:
      capacity: 6 # ความจุของถุงน้ำเทียร์ 1 (หน่วย: ครั้ง)
    2:
      capacity: 12 # ความจุของถุงน้ำเทียร์ 2
    3:
      capacity: 20 # ความจุของถุงน้ำเทียร์ 3

# --- การตั้งค่าสภาพอากาศ ---
weather:
  change-cooldown-minutes: 15 # คูลดาวน์การเปลี่ยนสภาพอากาศแบบสุ่ม (หน่วย: นาที)

# --- การตั้งค่า Scoreboard ---
scoreboard:
  title: "&b&lDynamicSurvival"
  lines:
    - "&7&m------------------"
    - "&fผู้เล่น: &a%player_name%"
    - ""
    - "&fฤดูกาล: %season_color%%season_name%"
    - "&fวันที่: &e%current_day%&7/&e%season_duration% &7(&c%days_left%&7 วัน)"
    - ""
    - "&fอุณหภูมิ: %temperature%"
    - "&fความกระหาย: &b%thirst_value%&7/&b%thirst_max%"
    - "&7&m------------------ " # เว้นวรรคท้ายเพื่อไม่ให้ซ้ำกับเส้นบน
