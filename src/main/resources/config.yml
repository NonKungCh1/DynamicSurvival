# ====================================
# DynamicSurvival Configuration
# ====================================

# การตั้งค่าพื้นฐานของระบบ
system:
  # ความถี่ในการอัปเดตสถานะผู้เล่น (หน่วยเป็น Ticks. 20 Ticks = 1 วินาที)
  # แนะนำ: 60 (ทุก 3 วินาที) หรือ 100 (ทุก 5 วินาที)
  update-frequency-ticks: 60
  
  # โลกที่ต้องการให้ระบบทำงาน (World Name)
  # ระบุชื่อโลกที่ต้องการติดตามสภาพอากาศและฤดูกาล
  tracked-world-name: "world"
  
  # รูปแบบการแสดงผลสถานะผู้เล่น
  # ตัวเลือก: ACTION_BAR (แถบข้อความด้านล่างจอ) หรือ SCOREBOARD (ป้ายด้านข้าง)
  display-mode: "ACTION_BAR" 

# ====================================
# การตั้งค่าฤดูกาล (Season)
# ====================================
season-duration:
  # ระยะเวลาของแต่ละฤดูกาล (หน่วยเป็นวันในเกม)
  spring: 20
  summer: 20
  autumn: 20
  winter: 20

# ====================================
# การตั้งค่าความกระหาย (Thirst)
# ====================================
thirst:
  # ระดับความกระหายสูงสุด (ค่าเริ่มต้น 100)
  max-level: 100 
  # อัตราการลดความกระหายพื้นฐานต่อรอบอัปเดต (เมื่อไม่มีกิจกรรมใด ๆ)
  base-loss-per-update: 1.0 
  # ระดับความกระหายที่เริ่มเกิดความเสียหาย (Damage) หรือผลกระทบ
  danger-level: 10
  # ปริมาณความกระหายที่เพิ่มขึ้นเมื่อดื่ม Water Bottle
  water-bottle-restore: 40
  # อัตราการลดความกระหายเพิ่มเติมเมื่อวิ่ง (Sprint) (ค่าที่ถูกนำไปคูณกับ base-loss)
  sprint-multiplier: 2.0 
  # อัตราการลดความกระหายเพิ่มเติมเมื่อขุด/ต่อย (Mine/Break Block)
  action-loss-per-block: 0.5 

# ====================================
# การตั้งค่าอุณหภูมิ (Temperature)
# ====================================
temperature:
  # อุณหภูมิพื้นฐานของแต่ละฤดูกาล (หน่วยเป็น °C)
  base-temp:
    spring: 25.0
    summer: 35.0
    autumn: 20.0
    winter: 5.0
  
  # ผลกระทบจากอุณหภูมิ
  effects:
    # อุณหภูมิที่ต่ำกว่าค่านี้จะเริ่มเกิดเอฟเฟกต์ "หนาวสั่น" (Freezing)
    freezing-threshold: 5.0
    # อุณหภูมิที่สูงกว่าค่านี้จะเริ่มเกิดเอฟเฟกต์ "ร้อน" (Damage)
    hot-threshold: 40.0
    # ความเสียหายที่ผู้เล่นจะได้รับเมื่อร้อน/หนาวเกินขีดจำกัด (ต่อรอบอัปเดต)
    damage-amount: 1.0

# ====================================
# การตั้งค่าสภาพอากาศ (Weather)
# ====================================
weather:
  # การปรับค่าตามสภาพอากาศ (ค่าที่ถูกนำไปเพิ่ม/ลดจากอุณหภูมิพื้นฐานเมื่อมีฝนตก)
  temp-modifier-on-rain: -5.0 
  
  # ความถี่และระยะเวลาของฝนปกติ
  normal-rain:
    chance: 0.33             # โอกาสเกิด (33%)
    min-day-occurrence: 1    # เกิดเร็วที่สุดในวันที่ 1
    max-day-occurrence: 3    # เกิดช้าที่สุดในวันที่ 3
    duration-min-days: 1     # ตกนานที่สุด 1 วัน
    duration-max-days: 2     # ตกนานที่สุด 2 วัน
    
  # ความถี่และระยะเวลาของฝนตกหนัก/พายุ
  heavy-storm:
    chance: 0.50             # โอกาสเกิด (50%)
    min-day-occurrence: 5    # เกิดเร็วที่สุดในวันที่ 5
    max-day-occurrence: 6    # เกิดช้าที่สุดในวันที่ 6
    duration-min-days: 4     # ตกนานที่สุด 4 วัน
    duration-max-days: 5     # ตกนานที่สุด 5 วัน

    
    freezing: 5.0      # < อุณหภูมิเยือกแข็ง (เกิด Slowness, Action Bar เป็นสีฟ้า)
    
    deadly-cold: -5.0  # < หนาวจัด (เริ่มเสีย Damage)

# --- การตั้งค่าสภาพอากาศ ---
weather:
  # ความน่าจะเป็นที่จะสุ่มเปลี่ยนสภาพอากาศทุกๆ 10 นาที (0.2 = 20%)
  chance-to-change: 0.2
