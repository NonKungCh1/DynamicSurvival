# ====================================
# DynamicSurvival Configuration
# ====================================

# การตั้งค่าฤดูกาล (Season)
season-duration:
  spring: 20
  summer: 20
  autumn: 20
  winter: 20

# ====================================
# การตั้งค่าความกระหาย (Thirst)
# ====================================
thirst:
  max-level: 100
  base-loss-per-update: 0.4
  water-bottle-restore: 30
  danger-level: 10

# ====================================
# การตั้งค่าอุณหภูมิ (Temperature)
# ====================================
temperature:
  base-temp:
    spring: 25.0
    summer: 35.0
    autumn: 20.0
    winter: 5.0
  thresholds:
    normal: 25.0
    hot: 35.0
    deadly-hot: 40.0
    freezing: 5.0
    cold: 0.0

# ====================================
# การตั้งค่าสภาพอากาศ (Weather)
# ====================================
weather:
  change-cooldown-minutes: 15

# ====================================
# การตั้งค่าผลกระทบพิเศษ (Special Effects)
# ====================================
special-effects:
  nether:
    temperature-increase: 60.0
    thirst-loss-multiplier: 2.5
    
  environment:
    fire-temp-increase: 10.0
    water-snow-temp-decrease: -10.0
    powder-snow-temp-decrease: -20.0
    
  leaf-armor-set-bonus:
    required-pieces: 3
    nether-heat-reduction: 60.0
    
  leather-armor-set-bonus:
    required-pieces: 3
    warmth-bonus: 15.0


# ====================================
# การตั้งค่า Scoreboard
# ====================================
scoreboard:
  title: "&b&lDynamicSurvival"
  lines:
    - "&7&m------------------"
    - "ฤดูกาล: %season_color%%season_name%"
    - "วันที่: &e%current_day% / %season_duration%"
    - ""
    - "อุณหภูมิ: %temperature%"
    - "ระดับน้ำ: &b%thirst_value%/%thirst_max%" 
    - ""
    - "ผู้เล่น: &a%player_name%"
    - "&7&m------------------"

# ---------------------------- #
#         Biome Effects        #
# ---------------------------- #
# การตั้งค่าพิเศษสำหรับ Biome ต่างๆ
biome-effects:
  desert:
    # ตัวคูณการเสียน้ำเมื่ออยู่ใน Biome ทะเลทราย (2.0 = เร็วขึ้น 2 เท่า)
    thirst-loss-multiplier: 2.0
  cold-biome:
    # ค่าอุณหภูมิที่จะลดลงเพิ่มเติมเมื่ออยู่ใน Biome ที่หนาวเย็น (เช่น Taiga, Snow)
    # ค่าติดลบหมายถึงทำให้อุณหภูมิลดลง
    temperature-decrease: -7.0

# ---------------------------- #
#      Water Pouch Settings    #
# ---------------------------- #
water-pouch:
  thirst-restore-amount: 30
  drink-cooldown-seconds: 1.5
  tiers:
    1:
      capacity: 6
    2:
      capacity: 12
    3:
      capacity: 20

