# ====================================
# DynamicSurvival Configuration
# ====================================

# การตั้งค่าฤดูกาล (Season)
season-duration:
  # ระยะเวลาของแต่ละฤดูกาล (หน่วยเป็นวันในเกม)
  spring: 20
  summer: 20
  autumn: 20
  winter: 20

# ====================================
# การตั้งค่าความกระหาย (Thirst)
# ====================================
thirst:
  max-level: 100
  base-loss-per-update: 1
  danger-level: 10
  water-bottle-restore: 30

# ====================================
# การตั้งค่าอุณหภูมิ (Temperature)
# ====================================
temperature:
  base-temp:
    spring: 25.0
    summer: 35.0
    autumn: 20.0
    winter: 5.0
  thresholds:
    normal: 25.0
    hot: 35.0
    deadly-hot: 40.0
    freezing: 5.0
    cold: 0.0

# ====================================
# การตั้งค่าสภาพอากาศ (Weather)
# ====================================
weather:
  # ระยะเวลาขั้นต่ำ (นาที) ที่สภาพอากาศจะคงที่ ก่อนจะมีการสุ่มเปลี่ยนแปลงอีกครั้ง
  change-cooldown-minutes: 15

# ====================================
# การตั้งค่า Scoreboard (ใหม่)
# ====================================
scoreboard:
  # หัวข้อของ Scoreboard (ใช้รหัสสี & ได้)
  title: "&b&lDynamicSurvival"
  
  # เนื้อหาที่จะแสดงบน Scoreboard (เรียงจากบนลงล่าง)
  # placeholders ที่ใช้ได้: %player_name%, %season_name%, %season_color%, %current_day%
  # %season_duration%, %days_left%, %temperature%, %thirst_bar%, %thirst_value%, %thirst_max%
  lines:
    - "&7&m------------------"
    - "ฤดูกาล: %season_color%%season_name%"
    - "วันที่: &e%current_day% / %season_duration%"
    - "" # บรรทัดว่าง
    - "อุณหภูมิ: %temperature%"
    - "ระดับน้ำ: %thirst_bar%"
    - "" # บรรทัดว่าง
    - "ผู้เล่น: &a%player_name%"
    - "&7&m------------------"
