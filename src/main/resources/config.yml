# ==========================================================
# DynamicSurvival Configuration
# ==========================================================

# --- 1. การตั้งค่าระยะเวลาฤดูกาล (หน่วยเป็นวันในเกม) ---
season-duration:
  spring: 20
  summer: 25
  autumn: 15
  winter: 30

# --- 2. การตั้งค่าหลอดน้ำ ---
thirst:
  max-level: 100
  base-loss-per-update: 1  # ลดลงต่อ 2 วินาที
  danger-level: 10         # ระดับที่ต่ำกว่านี้จะเกิดผลเสีย (Nausea)
  water-bottle-restore: 40 # ค่าที่เติมเมื่อดื่ม Water Bottle

# --- 3. การตั้งค่าอุณหภูมิ ---
temperature:
  # อุณหภูมิพื้นฐานสำหรับแต่ละฤดูกาล (หน่วยเป็น °C)
  base-temp:
    spring: 20.0
    summer: 30.0
    autumn: 15.0
    winter: 0.0
  
  # เกณฑ์การทำงานของผลกระทบ/การแสดงผล
  thresholds:
    normal: 25.0       # > อุณหภูมิปกติ (Action Bar เป็นสีเหลือง)
    hot: 35.0          # > อุณหภูมิร้อน (เกิด Weakness, Action Bar เป็นสีแดง)
    deadly-hot: 40.0   # > ร้อนจัด (เริ่มเสีย Damage)
    freezing: 5.0      # < อุณหภูมิเยือกแข็ง (เกิด Slowness, Action Bar เป็นสีฟ้า)
    deadly-cold: -5.0  # < หนาวจัด (เริ่มเสีย Damage)

# --- 4. การตั้งค่าสภาพอากาศ ---
weather:
  # ความน่าจะเป็นที่จะสุ่มเปลี่ยนสภาพอากาศทุกๆ 10 นาที (0.2 = 20%)
  chance-to-change: 0.2
