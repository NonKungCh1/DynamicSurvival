# ===============================================================
# DynamicSurvival v1.0 Configuration
# ===============================================================
# แก้ไขค่าต่างๆ ที่นี่ แล้วใช้คำสั่ง /ds reload ในเกมเพื่ออัปเดต
# ===============================================================

# --- การตั้งค่าฤดูกาล ---
# กำหนดจำนวนวันในเกมสำหรับแต่ละฤดูกาล
season-duration:
  spring: 20
  summer: 20
  autumn: 20
  winter: 20

# --- การตั้งค่าอุณหภูมิ ---
temperature:
  base-temp:
    spring: 25.0
    summer: 35.0
    autumn: 20.0
    winter: -5.0
  # กำหนดช่วงอุณหภูมิที่จะส่งผลกระทบต่อผู้เล่น
  thresholds:
    normal: 25.0
    hot: 35.0
    deadly-hot: 40.0
    freezing: 5.0
    cold: 0.0

# --- การตั้งค่าความกระหายน้ำ ---
thirst:
  max-level: 100
  # (ปรับแล้ว) อัตราการลดลงของน้ำพื้นฐาน ทุกๆ 2 วินาที (ค่ายิ่งน้อย น้ำยิ่งลดช้า)
  base-loss-per-update: 0.25
  water-bottle-restore: 30
  danger-level: 10

# --- การตั้งค่าสถานะเอฟเฟกต์ (เพิ่มใหม่) ---
# กำหนดระยะเวลาและความรุนแรงของเอฟเฟกต์ต่างๆ
# duration: หน่วยเป็น tick (20 ticks = 1 วินาที)
# amplifier: ความรุนแรง (0 = level 1, 1 = level 2)
status-effects:
  freezing-slowness:
    duration: 60
    amplifier: 0
  hot-weakness:
    duration: 60
    amplifier: 0
  no-thirst-slowness:
    duration: 60
    amplifier: 1
  no-thirst-nausea:
    duration: 100 # ลดลงจากเดิม

# --- เอฟเฟกต์พิเศษและชุดเกราะ ---
special-effects:
  leaf-armor-set-bonus:
    required-pieces: 3
    # (เพิ่ม) ค่าการลดอุณหภูมิในโลกปกติ (เมื่อใส่ครบเซ็ต)
    temperature-reduction: 5.0
    nether-heat-reduction: 60.0
  leather-armor-set-bonus:
    required-pieces: 3
    warmth-bonus: 15.0
  nether:
    temperature-increase: 60.0
    thirst-loss-multiplier: 2.5
  environment:
    fire-temp-increase: 10.0
    water-snow-temp-decrease: -10.0
    powder-snow-temp-decrease: -20.0

# --- เอฟเฟกต์ตาม Biome ---
biome-effects:
  desert:
    # ตัวคูณการเสียน้ำในทะเลทราย (2.0 = เร็วขึ้น 2 เท่า)
    thirst-loss-multiplier: 2.0
  cold-biome:
    # อุณหภูมิที่จะลดลงเพิ่มเติมเมื่ออยู่ใน Biome ที่หนาวเย็น
    temperature-decrease: -7.0

# --- การตั้งค่ากระเป๋าน้ำ ---
water-pouch:
  thirst-restore-amount: 30
  drink-cooldown-seconds: 1.5
  tiers:
    1:
      capacity: 6
    2:
      capacity: 12
    3:
      capacity: 20

# --- การตั้งค่าสภาพอากาศ ---
weather:
  change-cooldown-minutes: 15

# --- การตั้งค่า Scoreboard ---
scoreboard:
  title: "&b&lDynamicSurvival"
  lines:
    - "&7&m------------------"
    - "&fผู้เล่น: &a%player_name%"
    - ""
    - "&fฤดูกาล: %season_color%%season_name%"
    - "&fวันที่: &e%current_day%&7/&e%season_duration% &7(&c%days_left%&7 วัน)"
    - ""
    - "&fอุณหภูมิ: %temperature%"
    - "&fความกระหาย: &b%thirst_value%&7/&b%thirst_max%"
    - "&7&m------------------ "
