name: Maven Build and Deploy to Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build ด้วย Maven
      - name: Build with Maven
        run: mvn clean package -B

      # 4. ค้นหา JAR Artifact
      - name: Find Artifact JAR
        id: find_jar
        run: |
          echo "JAR_PATH=$(find target/ -name 'DynamicSurvival-*.jar' -print -quit)" >> $GITHUB_ENV

      # 5. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicSurvival-Plugin
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error

      # 6. Discord Notification
      - name: Discord Notification
        uses: tsickert/discord-webhook@v7.0.0
        if: always()
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          raw-data: |
            {
              "username": "DynamicSurvival Builder",
              "avatar_url": "https://avatars.githubusercontent.com/u/44036562",
              "embeds": [
                {
                  "title": "${{ job.status == 'success' && '✅ BUILD SUCCESSFUL' || '❌ BUILD FAILED' }}: DynamicSurvival Plugin",
                  "description": "**Commit:** `${{ github.event.head_commit.message }}`",
                  "color": ${{ job.status == 'success' && 3066993 || 15158332 }},
                  "fields": [
                    {
                      "name": "Version / Branch",
                      "value": "`v${{ github.ref_name }}`",
                      "inline": true
                    },
                    {
                      "name": "Author",
                      "value": "${{ github.actor }}",
                      "inline": true
                    },
                    {
                      "name": "Artifacts",
                      "value": "[Download Artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                    }
                  ],
                  "timestamp": "${{ github.event.head_commit.timestamp }}"
                }
              ]
            }

      # 7. สร้าง GitHub Release (เฉพาะ Tag)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR_PATH }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
