# ชื่อของ Workflow นี้
name: Maven Build and Deploy to Release

# กำหนดเหตุการณ์ที่จะกระตุ้น Workflow นี้
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# กำหนด Jobs ที่จะรันใน Workflow
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build ด้วย Maven
      - name: Build with Maven
        run: mvn clean package -B

      # 4. คัดลอก Artifact
      - name: Find Artifact JAR
        id: find_jar
        run: echo "JAR_PATH=$(find target/ -name "DynamicSurvival-*.jar" -print -quit)" >> $GITHUB_ENV
        
      # 5. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicSurvival-Plugin
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error

      # ... (โค้ดส่วนบนสุดของ YAML เหมือนเดิม) ...

# ... (Step 1 ถึง Step 5 เหมือนเดิม) ...

      # 6. *** NEW STEP: Discord Notification (ใช้ Action ตัวใหม่) ***
      - name: Discord Notification
        uses: tsickert/discord-webhook@v7.0.0 # เปลี่ยนเป็น Action ที่ใช้งานได้
        if: always() # ให้รันเสมอยกเว้นกรณี Error ที่ทำให้ workflow หยุดทันที
        with:
          # ใช้ key เป็น webhook-url (ตามที่ Action นี้กำหนด)
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }} 
          # ใช้ raw-data เพื่อส่ง JSON Embed ที่สวยงาม (แนะนำ)
          raw-data: |
            {
              "username": "DynamicSurvival Builder",
              "avatar_url": "https://avatars.githubusercontent.com/u/44036562", 
              "embeds": [
                {
                  "title": "✅ BUILD SUCCESSFUL: DynamicSurvival Plugin",
                  "description": "**Commit:** `${{ github.event.head_commit.message }}`",
                  "color": 3066993,
                  "fields": [
                    {
                      "name": "Version / Branch",
                      "value": "`v${{ github.ref_name }}`",
                      "inline": true
                    },
                    {
                      "name": "Author",
                      "value": "${{ github.actor }}",
                      "inline": true
                    },
                    {
                      "name": "Artifacts",
                      "value": "[Download Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                    }
                  ],
                  "timestamp": "${{ github.event.head_commit.timestamp }}"
                }
              ]
            }
          
      # 7. สร้าง Release (Optional)
      - name: Create Release (Optional)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR_PATH }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
